<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - متوسطة الجوادين للبنين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #d97706;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* نافذة الحماية الفخمة */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 2px solid rgba(217, 119, 6, 0.4);
        }

        .login-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .login-logos img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .login-card h2 {
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-size: 20px;
            font-weight: 800;
        }

        .login-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .login-card input:focus {
            border-color: var(--primary);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .login-card button:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.3);
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        /* الواجهة الرئيسية */
        .dashboard-container {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 15px;
        }

        header {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-top: 6px solid var(--accent);
            border-bottom: 1px solid var(--border);
        }

        .header-logo {
            height: 65px;
            width: auto;
            object-fit: contain;
        }

        .header-title {
            text-align: center;
        }

        .header-title h1 {
            font-size: 22px;
            color: var(--primary);
            font-weight: 800;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .controls {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            height: 45px;
            padding: 0 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-input {
            flex-grow: 1;
            min-width: 250px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--primary-dark);
            padding: 16px;
            font-weight: 800;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .btn-view {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
            margin-left: 5px;
        }

        .btn-view:hover {
            background: #0284c7;
            color: white;
        }

        .btn-delete {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        /* النافذة المنبثقة للتفاصيل الكاملة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 650px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: var(--primary);
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 17px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-group {
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .info-group.full-width {
            grid-column: span 2;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-logos">
                <img src="شعار_وزارة_التربية_العراقية.svg" alt="وزارة التربية">
                <img src="2.jpg" alt="متوسطة الجوادين" style="border-radius: 50%;">
            </div>
            <h2>لوحة التحكم الإدارية</h2>
            <p>متوسطة الجوادين للبنين - سجل الطلاب</p>
            <input type="password" id="passInput" placeholder="أدخل رمز المرور..." onkeypress="handleKeyPress(event)">
            <button onclick="checkPassword()">دخول الصفحة</button>
            <div id="errorMsg" class="error-msg">رمز المرور غير صحيح!</div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="dashboard-container" id="mainDashboard">
        <header>
            <img src="شعار_وزارة_التربية_العراقية.svg" alt="شعار وزارة التربية" class="header-logo">
            <div class="header-title">
                <h1>جمهورية العراق - وزارة التربية</h1>
                <p>سجل بيانات الطلاب الإلكتروني - متوسطة الجوادين للبنين</p>
            </div>
            <img src="2.jpg" alt="شعار المدرسة" class="header-logo" style="border-radius: 50%;">
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث باسم الطالب، اسم الأم، أو الرقم الموحد..." oninput="filterData()">
            
            <select id="filterGrade" class="filter-select" onchange="filterData()">
                <option value="">جميع الصفوف</option>
                <option value="الأول متوسط">الأول متوسط</option>
                <option value="الثاني متوسط">الثاني متوسط</option>
                <option value="الثالث متوسط">الثالث متوسط</option>
            </select>

            <select id="filterSection" class="filter-select" onchange="filterData()">
                <option value="">جميع الشعب</option>
                <option value="أ">أ</option>
                <option value="ب">ب</option>
                <option value="ج">ج</option>
                <option value="د">د</option>
                <option value="هـ">هـ</option>
                <option value="و">و</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الطالب الرباعي</th>
                        <th>الصف والشعبة</th>
                        <th>هاتف ولي الأمر</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 30px; color: var(--text-muted);">جاري تحميل البيانات من قاعدة البيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة تفاصيل الطالب المنبثقة -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>تفاصيل استمارة الطالب كاملة</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- يتم تعبئة التفاصيل ديناميكياً -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const SECRET_PASS = "jawadim_database_124";

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if (input === SECRET_PASS) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                loadFirebaseData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') checkPassword();
        }

        const firebaseConfig = {
            databaseURL: "https://aljawadindatabase-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allStudents = [];

        function loadFirebaseData() {
            database.ref('students').on('value', snapshot => {
                allStudents = [];
                const data = snapshot.val();
                
                if (data) {
                    for (let id in data) {
                        allStudents.push({ id, ...data[id] });
                    }
                }
                renderTable(allStudents);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px; color: var(--text-muted);">لا توجد بيانات مطابقة للبحث.</td></tr>';
                return;
            }

            data.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${student.fullName || '-'}</strong></td>
                    <td><span class="badge">${student.grade || '-'} / ${student.section || '-'}</span></td>
                    <td>${student.parentPhone || '-'}</td>
                    <td>
                        <button class="btn-view" onclick="openDetails('${student.id}')">عرض البيانات الكاملة</button>
                        <button class="btn-delete" onclick="deleteStudent('${student.id}', '${student.fullName}')">حذف</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function openDetails(id) {
            const student = allStudents.find(s => s.id === id);
            if (!student) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="info-group full-width">
                    <div class="info-label">اسم الطالب الرباعي واللقب</div>
                    <div class="info-value">${student.fullName || '-'}</div>
                </div>
                <div class="info-group full-width">
                    <div class="info-label">اسم الأم الثلاثي</div>
                    <div class="info-value">${student.motherName || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الصف والمرحلة الدراسية</div>
                    <div class="info-value">${student.grade || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الشعبة</div>
                    <div class="info-value">${student.section || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">رقم البطاقة الموحدة</div>
                    <div class="info-value">${student.nationalId || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">تاريخ التولد</div>
                    <div class="info-value">${student.birthDate || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">فصيلة الدم</div>
                    <div class="info-value">${student.bloodType || 'غير محدد'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">رقم هاتف ولي الأمر</div>
                    <div class="info-value">${student.parentPhone || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">رقم هاتف الطالب (إن وجد)</div>
                    <div class="info-value">${student.studentPhone || 'لا يوجد'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">المحلة</div>
                    <div class="info-value">${student.address?.mahalla || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الزقاق</div>
                    <div class="info-value">${student.address?.zuqaq || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الدار</div>
                    <div class="info-value">${student.address?.dar || '-'}</div>
                </div>
                <div class="info-group full-width">
                    <div class="info-label">أقرب نقطة دالة / ملاحظات أخرى</div>
                    <div class="info-value">${student.notes || student.landmark || 'لا توجد'}</div>
                </div>
            `;

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedGrade = document.getElementById('filterGrade').value;
            const selectedSection = document.getElementById('filterSection').value;

            const filtered = allStudents.filter(s => {
                const matchesSearch = (s.fullName && s.fullName.toLowerCase().includes(search)) ||
                                      (s.motherName && s.motherName.toLowerCase().includes(search)) ||
                                      (s.nationalId && s.nationalId.includes(search));
                
                const matchesGrade = selectedGrade === '' || s.grade === selectedGrade;
                const matchesSection = selectedSection === '' || s.section === selectedSection;

                return matchesSearch && matchesGrade && matchesSection;
            });

            renderTable(filtered);
        }

        function deleteStudent(id, name) {
            if (confirm(`هل أنت تأكد من رغبتك في حذف بيانات الطالب: (${name})؟`)) {
                database.ref('students/' + id).remove().then(() => {
                    alert('تم حذف البيانات بنجاح.');
                }).catch(err => {
                    alert('حدث خطأ أثناء عملية الحذف.');
                });
            }
        }
    </script>
</body>
</html>
