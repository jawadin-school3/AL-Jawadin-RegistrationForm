<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - متوسطة الجوادين للبنين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --accent: #d97706;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* نافذة الحماية الفخمة */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 2px solid var(--accent);
        }

        .login-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .login-logos img {
            height: 75px;
            width: 75px;
            object-fit: contain;
            border-radius: 50%;
            background: #f8fafc;
            padding: 4px;
            border: 2px solid var(--accent);
        }

        .login-card h2 {
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 20px;
            font-weight: 800;
        }

        .login-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .login-card input:focus {
            border-color: var(--primary);
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .login-card button:hover {
            background: var(--primary-dark);
        }

        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        /* الواجهة الرئيسية */
        .dashboard-container {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            padding: 15px;
        }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-top: 5px solid var(--accent);
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .header-logo {
            height: 60px;
            width: 60px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-title {
            text-align: center;
            flex-grow: 1;
        }

        .header-title h1 {
            font-size: 18px;
            color: var(--primary);
            font-weight: 800;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .controls {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .filter-select {
            flex: 1;
            min-width: 130px;
            height: 42px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-dark);
            padding: 14px 12px;
            font-weight: 800;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            background-color: #e0e7ff;
            color: #3730a3;
            display: inline-block;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-view {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: 0.2s;
            flex-grow: 1;
            text-align: center;
        }

        .btn-delete {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: 0.2s;
        }

        /* للتلفونات الصغيرة */
        @media (max-width: 600px) {
            header {
                padding: 12px;
            }
            .header-logo {
                height: 45px;
                width: 45px;
            }
            .header-title h1 {
                font-size: 15px;
            }
            .header-title p {
                font-size: 10px;
            }
            
            /* تحويل الجدول لنظام كروت بالموبايل */
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead {
                display: none;
            }
            tr {
                margin-bottom: 12px;
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 12px;
                background: #fff;
            }
            td {
                padding: 6px 0;
                border: none;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            td::before {
                content: attr(data-label);
                font-weight: 700;
                color: var(--text-muted);
                font-size: 12px;
            }
            .action-btns {
                width: 100%;
                margin-top: 8px;
            }
        }

        /* النافذة المنبثقة للتفاصيل */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 15px;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 16px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .info-group {
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .info-group.full-width {
            grid-column: span 2;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 13.5px;
            color: var(--text-main);
            font-weight: 700;
        }

        @media (max-width: 500px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
            .info-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-logos">
                <img src="شعار_وزارة_التربية_العراقية.svg" alt="وزارة التربية">
                <img src="2.jpg" alt="متوسطة الجوادين">
            </div>
            <h2>لوحة التحكم الإدارية</h2>
            <p>متوسطة الجوادين للبنين</p>
            <input type="password" id="passInput" placeholder="أدخل رمز المرور..." onkeypress="handleKeyPress(event)">
            <button onclick="checkPassword()">دخول الصفحة</button>
            <div id="errorMsg" class="error-msg">رمز المرور غير صحيح!</div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="dashboard-container" id="mainDashboard">
        <header>
            <img src="شعار_وزارة_التربية_العراقية.svg" alt="شعار وزارة التربية" class="header-logo">
            <div class="header-title">
                <h1>وزارة التربية العراقية</h1>
                <p>سجل بيانات الطلاب - متوسطة الجوادين للبنين</p>
            </div>
            <img src="2.jpg" alt="شعار المدرسة" class="header-logo" style="border-radius: 50%;">
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث باسم الطالب، اسم الأم، أو الرقم الموحد..." oninput="filterData()">
            
            <select id="filterGrade" class="filter-select" onchange="filterData()">
                <option value="">جميع الصفوف</option>
                <option value="الأول متوسط">الأول متوسط</option>
                <option value="الثاني متوسط">الثاني متوسط</option>
                <option value="الثالث متوسط">الثالث متوسط</option>
            </select>

            <select id="filterSection" class="filter-select" onchange="filterData()">
                <option value="">جميع الشعب</option>
                <option value="أ">أ</option>
                <option value="ب">ب</option>
                <option value="ج">ج</option>
                <option value="د">د</option>
                <option value="هـ">هـ</option>
                <option value="و">و</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>اسم الطالب الرباعي واللقب</th>
                        <th>الصف والشعبة</th>
                        <th style="text-align: center;">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">جاري تحميل البيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة التفاصيل -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>استمارة بيانات الطالب الكاملة</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // رمز المرور الجديد والمبسط
        const SECRET_PASS = "jawadin2026";

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if (input === SECRET_PASS) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                loadFirebaseData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') checkPassword();
        }

        const firebaseConfig = {
            databaseURL: "https://aljawadindatabase-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allStudents = [];

        function loadFirebaseData() {
            database.ref('students').on('value', snapshot => {
                allStudents = [];
                const data = snapshot.val();
                
                if (data) {
                    for (let id in data) {
                        allStudents.push({ id, ...data[id] });
                    }
                }
                renderTable(allStudents);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px; color: var(--text-muted);">لا توجد بيانات مطابقة للبحث.</td></tr>';
                return;
            }

            data.forEach((student, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td data-label="#">${index + 1}</td>
                    <td data-label="الاسم"><strong>${student.fullName || '-'}</strong></td>
                    <td data-label="الصف"><span class="badge">${student.grade || '-'} / ${student.section || '-'}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-view" onclick="openDetails('${student.id}')">عرض البيانات</button>
                            <button class="btn-delete" onclick="deleteStudent('${student.id}', '${student.fullName}')">حذف</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function openDetails(id) {
            const student = allStudents.find(s => s.id === id);
            if (!student) return;

            // التأكد من جلب قيمة "أقرب نقطة دالة" بجميع المسميات الممكنة في الفايربيس
            const landmarkValue = student.landmark || 
                                 student.nearestLandmark || 
                                 student.nearPoint || 
                                 student.notes || 
                                 (student.address && (student.address.landmark || student.address.nearestLandmark || student.address.notes)) || 
                                 'لا توجد';

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="info-group full-width">
                    <div class="info-label">اسم الطالب الرباعي واللقب</div>
                    <div class="info-value">${student.fullName || '-'}</div>
                </div>
                <div class="info-group full-width">
                    <div class="info-label">اسم الأم الثلاثي</div>
                    <div class="info-value">${student.motherName || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الصف الدراسي</div>
                    <div class="info-value">${student.grade || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الشعبة</div>
                    <div class="info-value">${student.section || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">رقم البطاقة الموحدة</div>
                    <div class="info-value">${student.nationalId || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">تاريخ التولد</div>
                    <div class="info-value">${student.birthDate || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">فصيلة الدم</div>
                    <div class="info-value">${student.bloodType || 'غير محدد'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">هاتف ولي الأمر</div>
                    <div class="info-value">${student.parentPhone || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">المحلة</div>
                    <div class="info-value">${student.address?.mahalla || student.mahalla || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الزقاق</div>
                    <div class="info-value">${student.address?.zuqaq || student.zuqaq || '-'}</div>
                </div>
                <div class="info-group">
                    <div class="info-label">الدار</div>
                    <div class="info-value">${student.address?.dar || student.dar || '-'}</div>
                </div>
                <div class="info-group full-width">
                    <div class="info-label">أقرب نقطة دالة</div>
                    <div class="info-value">${landmarkValue}</div>
                </div>
            `;

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        function filterData() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedGrade = document.getElementById('filterGrade').value;
            const selectedSection = document.getElementById('filterSection').value;

            const filtered = allStudents.filter(s => {
                const matchesSearch = (s.fullName && s.fullName.toLowerCase().includes(search)) ||
                                      (s.motherName && s.motherName.toLowerCase().includes(search)) ||
                                      (s.nationalId && s.nationalId.includes(search));
                
                const matchesGrade = selectedGrade === '' || s.grade === selectedGrade;
                const matchesSection = selectedSection === '' || s.section === selectedSection;

                return matchesSearch && matchesGrade && matchesSection;
            });

            renderTable(filtered);
        }

        function deleteStudent(id, name) {
            if (confirm(`هل أنت تأكد من حذف بيانات الطالب: (${name})؟`)) {
                database.ref('students/' + id).remove().then(() => {
                    alert('تم الحذف بنجاح.');
                }).catch(() => {
                    alert('حدث خطأ أثناء الحذف.');
                });
            }
        }
    </script>
</body>
</html>
